name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - name: Install (server + client)
        run: npm ci
      - name: Check server files
        run: npm run check
      - name: Type-check and build the React app
        run: npm run build
